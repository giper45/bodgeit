services:
  bodgeit:
    build: .
    container_name: bodgeit
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - bodgeit-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http bodgeit:8080
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - bodgeit
    networks:
      - bodgeit-net

networks:
  bodgeit-net:
    driver: bridge
